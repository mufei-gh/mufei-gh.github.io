<link rel="icon" href="/favicon.ico" sizes="any">
<script>
/* The site routes on the hash, so any real path lands here. Send the
   old prerendered URLs to their new equivalents, everything else home. */
(function () {
  var p = location.pathname.replace(/\/+$/, '');
  var to = p === '/about' ? '/#/about' : '/';
  location.replace(to + (p === '/about' ? '' : location.hash));
})();
</script>
<meta http-equiv="refresh" content="0;url=/">
